name: Set up LMhdX environment
description: Install a supported Python and resolve declared compatible dependencies

inputs:
  python-version:
    description: Supported Python version to install
    required: false
    default: "3.11"
  extras:
    description: Comma-separated optional dependency groups to install
    required: false
    default: dev
  solvax-version:
    description: Optional exact SOLVAX compatibility endpoint
    required: false
    default: ""
  cache-suffix:
    description: Stable lane name for the persistent JAX compilation cache
    required: false
    default: default

runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pinned uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.11.28"
        # Self-hosted runners manage Python through uv and share one uv cache.
        python-version: ${{ runner.environment == 'github-hosted' && '' || inputs.python-version }}
        enable-cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-glob: pyproject.toml

    - name: Restore JAX compilation cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/lmx-jax-cache
        key: lmx-jax-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ inputs.cache-suffix }}-${{ hashFiles('pyproject.toml', 'src/**/*.py') }}
        restore-keys: lmx-jax-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ inputs.cache-suffix }}-

    - name: Enable bounded persistent compilation caching
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/lmx-jax-cache"
        echo "JAX_COMPILATION_CACHE_DIR=${RUNNER_TEMP}/lmx-jax-cache" >> "$GITHUB_ENV"
        echo "JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=1" >> "$GITHUB_ENV"
        echo "JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES=-1" >> "$GITHUB_ENV"

    - name: Install LMhdX
      shell: bash
      env:
        UV_PYTHON: ${{ inputs.python-version }}
      run: |
        uv venv --python "${{ inputs.python-version }}" .venv
        requirements=(-e .)
        if [[ -n "${{ inputs.extras }}" ]]; then
          requirements=(-e ".[${{ inputs.extras }}]")
        fi
        if [[ -n "${{ inputs.solvax-version }}" ]]; then
          requirements+=("solvax==${{ inputs.solvax-version }}")
        fi
        uv pip install --python .venv/bin/python "${requirements[@]}"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
