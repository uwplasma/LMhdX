name: external-validation

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: lmx-external-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FREEMHD_COMMIT: 14b54a3e8e1a05b6ee4c98331995abaaae96e7a5
  FREEMHD_INSTALL_COMMIT: 36f409d294ba3170d64d4073378d5ef68401072f
  MPLBACKEND: Agg
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      b2: ${{ steps.scope.outputs.b2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Select external validation work
        run: |
          base="origin/${{ github.base_ref }}...HEAD"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "b2=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$base" -- \
            validation/freemhd.py src/lmhdx/coreflow.py \
            src/lmhdx/data/benchmarks/specs/alex-b2-square.toml \
            src/lmhdx/data/benchmarks/references/alex-b2-square.csv \
            .github/workflows/external-validation.yml .github/actions pyproject.toml; then
            echo "b2=true" >> "$GITHUB_OUTPUT"
          else
            echo "b2=false" >> "$GITHUB_OUTPUT"
          fi

  freemhd-b2:
    name: Pinned FreeMHD B2 Docker run and core-flow comparison
    needs: impact
    if: needs.impact.outputs.b2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lmhdx

      - name: Resolve pinned external sources
        run: |
          git clone --filter=blob:none https://github.com/rogeriojorge/freemhd_install.git \
            "$RUNNER_TEMP/freemhd-install"
          git -C "$RUNNER_TEMP/freemhd-install" checkout --detach "$FREEMHD_INSTALL_COMMIT"
          git -C "$RUNNER_TEMP/freemhd-install" rev-parse HEAD > "$RUNNER_TEMP/freemhd-install.commit"
          grep -qx "$FREEMHD_INSTALL_COMMIT" "$RUNNER_TEMP/freemhd-install.commit"

          git clone --filter=blob:none https://github.com/PlasmaControl/FreeMHD.git \
            "$RUNNER_TEMP/FreeMHD-source"
          git -C "$RUNNER_TEMP/FreeMHD-source" checkout --detach "$FREEMHD_COMMIT"
          git -C "$RUNNER_TEMP/FreeMHD-source" rev-parse HEAD > "$RUNNER_TEMP/FreeMHD-source.commit"
          grep -qx "$FREEMHD_COMMIT" "$RUNNER_TEMP/FreeMHD-source.commit"

      - name: Build the pinned FreeMHD image
        run: |
          docker build \
            --build-arg FREEMHD_REF="$FREEMHD_COMMIT" \
            --tag freemhd-install:validation \
            "$RUNNER_TEMP/freemhd-install"
          mkdir -p artifacts/freemhd-b2
          docker image inspect freemhd-install:validation --format '{{.Id}}' \
            > artifacts/freemhd-b2/image-id.txt

      - name: Run FreeMHD and the LMhdX core flow
        run: |
          python -m validation.freemhd \
            --freemhd-image freemhd-install:validation \
            --freemhd-install-dir "$RUNNER_TEMP/freemhd-install" \
            --freemhd-source-repo "$RUNNER_TEMP/FreeMHD-source" \
            --timeout 1200 \
            --output artifacts/freemhd-b2/evidence

      - name: Upload evidence
        if: always()
        # Storage availability must not rewrite a completed physics verdict.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: freemhd-b2-evidence
          path: artifacts/freemhd-b2
          if-no-files-found: error
          retention-days: 7
