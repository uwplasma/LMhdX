name: release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optional package publish target
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  external-validation:
    uses: ./.github/workflows/external-validation.yml

  validation:
    uses: ./.github/workflows/ci.yml

  documentation:
    uses: ./.github/workflows/docs.yml

  build:
    needs: [external-validation, validation, documentation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-lmhdx
        with:
          extras: release
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/audit_architecture.py --check \
            --wheel dist/*.whl --sdist dist/*.tar.gz
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/lmhdx-wheel-check
          /tmp/lmhdx-wheel-check/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd /tmp
          /tmp/lmhdx-wheel-check/bin/lmhdx --help >/dev/null
          /tmp/lmhdx-wheel-check/bin/lmx --help >/dev/null
          /tmp/lmhdx-wheel-check/bin/python - <<'PY'
          import jax
          import jax.numpy as jnp

          from lmhdx import make_hartmann_case, solve, solve_fully_developed_fields
          import tomllib
          from importlib.resources import files

          data = files("lmhdx") / "data" / "benchmarks"
          for name in ("shercliff-ha20", "hunt-ha20", "alex-b1-pipe", "alex-b2-square"):
              assert tomllib.loads((data / "specs" / f"{name}.toml").read_text())["id"]
          for name in ("alex-b1-pipe.csv", "alex-b2-square.csv", "samper-table-i.toml"):
              assert (data / "references" / name).read_text()
          solution = solve(make_hartmann_case(ha=5, ny=4, nz=4))
          assert solution.state.residual < 1e-7
          case = make_hartmann_case(ha=5, ny=4, nz=4)
          value, derivative = jax.jit(jax.value_and_grad(
              lambda scale: jnp.mean(
                  solve_fully_developed_fields(case, magnetic_field_scale=scale)[0]
              )
          ))(jnp.asarray(1.0))
          assert jnp.isfinite(value)
          assert jnp.isfinite(derivative)
          PY
      - name: Save distributions for publishing
        uses: actions/cache/save@v6
        with:
          path: dist
          key: lmhdx-distributions-${{ github.run_id }}-${{ github.sha }}

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lmhdx
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: dist
          key: lmhdx-distributions-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/lmhdx
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: dist
          key: lmhdx-distributions-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: pypa/gh-action-pypi-publish@release/v1
