name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: lmx-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      targeted: ${{ steps.scope.outputs.targeted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Select test depth
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "targeted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -Eq '^(\.github/|src/lmhdx/|validation/|tests/|examples/|pyproject\.toml$|MANIFEST\.in$)' <<< "$changed"; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "targeted=false" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^scripts/' <<< "$changed"; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "targeted=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "targeted=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Metadata and architecture
    needs: scope
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.targeted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-lmhdx
        with:
          python-version: "3.13"
      - name: Check Python quality
        run: |
          python -m ruff check src/lmhdx validation tests examples scripts docs/conf.py
          python -m ruff format --check src/lmhdx validation tests examples scripts docs/conf.py
      - name: Enforce architecture budgets
        run: python scripts/audit_architecture.py --check --measure-import

  pr-impact:
    name: Changed numerical surface
    needs: scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.targeted == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-lmhdx
        with:
          python-version: "3.10"
          solvax-version: "0.34.0"
          cache-suffix: pr-impact
      - name: Run conservatively affected tests
        run: |
          python scripts/run_full_test_suite.py \
            --changed-from "origin/${{ github.base_ref }}" \
            --budget-seconds 540 --test-timeout-seconds 300
      - name: Free workspace
        if: always()
        run: rm -rf .venv

  compatibility:
    name: Python 3.10 (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [support, design, operators, physics, channel, plane, steady, programs, fully_developed, gradients, api, anchors]
        include:
          # Coverage on the steady shard peaks near 12 GB of resident memory with four
          # workers, against 16 GB on a hosted runner; two workers keep it well inside.
          - shard: steady
            workers: 2
          - shard: support
            workers: 1
          - shard: gradients
            workers: 2
            cache: steady
          # A split shard starts from its parent's compilation cache.
          - shard: operators
            cache: support
          - shard: design
            cache: support
          - shard: plane
            cache: channel
          - shard: fully_developed
            cache: steady
          - shard: programs
            workers: 2
            cache: steady
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-lmhdx
        with:
          python-version: "3.10"
          solvax-version: "0.34.0"
          cache-suffix: ${{ matrix.cache || matrix.shard }}
      - name: Run covered test shard
        env:
          COVERAGE_FILE: artifacts/test-evidence/${{ matrix.shard }}/.coverage.${{ matrix.shard }}
        run: |
          mkdir -p "artifacts/test-evidence/${{ matrix.shard }}"
          workers=(--workers "${{ matrix.workers || 3 }}")
          python scripts/run_full_test_suite.py --budget-seconds 1500 \
            --test-timeout-seconds 600 --shard ${{ matrix.shard }} "${workers[@]}" \
            --coverage-fail-under 0 \
            --coverage-xml artifacts/test-evidence/${{ matrix.shard }}/coverage.xml \
            --junit-xml artifacts/test-evidence/${{ matrix.shard }}/junit.xml
      - name: Save covered test evidence
        uses: actions/cache/save@v6
        with:
          path: artifacts/test-evidence/${{ matrix.shard }}
          key: lmx-test-evidence-${{ github.run_id }}-${{ matrix.shard }}
      - name: Free workspace
        if: always()
        run: rm -rf .venv

  coverage:
    name: Combined branch coverage
    needs: [scope, compatibility]
    if: needs.scope.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-lmhdx
        with:
          python-version: "3.13"
          cache-suffix: coverage-report
      - name: Restore support evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/support
          key: lmx-test-evidence-${{ github.run_id }}-support
          fail-on-cache-miss: true
      - name: Restore design evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/design
          key: lmx-test-evidence-${{ github.run_id }}-design
          fail-on-cache-miss: true
      - name: Restore physics evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/physics
          key: lmx-test-evidence-${{ github.run_id }}-physics
          fail-on-cache-miss: true
      - name: Restore channel evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/channel
          key: lmx-test-evidence-${{ github.run_id }}-channel
          fail-on-cache-miss: true
      - name: Restore steady evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/steady
          key: lmx-test-evidence-${{ github.run_id }}-steady
          fail-on-cache-miss: true
      - name: Restore fully_developed evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/fully_developed
          key: lmx-test-evidence-${{ github.run_id }}-fully_developed
          fail-on-cache-miss: true
      - name: Restore programs evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/programs
          key: lmx-test-evidence-${{ github.run_id }}-programs
          fail-on-cache-miss: true
      - name: Restore operators evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/operators
          key: lmx-test-evidence-${{ github.run_id }}-operators
          fail-on-cache-miss: true
      - name: Restore plane evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/plane
          key: lmx-test-evidence-${{ github.run_id }}-plane
          fail-on-cache-miss: true
      - name: Restore gradients evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/gradients
          key: lmx-test-evidence-${{ github.run_id }}-gradients
          fail-on-cache-miss: true
      - name: Restore api evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/api
          key: lmx-test-evidence-${{ github.run_id }}-api
          fail-on-cache-miss: true
      - name: Restore anchors evidence
        uses: actions/cache/restore@v6
        with:
          path: artifacts/test-evidence/anchors
          key: lmx-test-evidence-${{ github.run_id }}-anchors
          fail-on-cache-miss: true
      - name: Combine and enforce coverage
        run: |
          python -m coverage combine artifacts/test-evidence/*
          python -m coverage report --fail-under=95
          python -m coverage xml -o coverage.xml

  pr-tests:
    name: PR ${{ matrix.tier }}${{ (matrix.label || matrix.shard) && format(' ({0})', matrix.label || matrix.shard) || '' }}
    needs: scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          # Three jobs keep the shared Mac runners free: the unit tier, then the
          # regression tier in two halves packed on recorded per-shard time (about
          # 10, 19 and 20 minutes). Each job starts from its own compilation cache.
          - tier: unit
            shard: "support design operators physics channel plane steady programs fully_developed gradients"
            label: unit
            workers: 3
            budget: 900
            cache: pr-unit
          - tier: regression
            shard: "physics operators steady programs fully_developed support"
            label: regression-a
            budget: 1500
          - tier: regression
            shard: "channel plane gradients api anchors"
            label: regression-b
            budget: 1500
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-lmhdx
        with:
          python-version: "3.10"
          solvax-version: "0.34.0"
          cache-suffix: ${{ matrix.cache || format('pr-{0}{1}', matrix.tier, matrix.label || matrix.shard) }}
      - name: Run uncovered evidence tier
        env:
          TIER: ${{ matrix.tier }}
          SHARD: ${{ matrix.shard }}
          BUDGET: ${{ matrix.budget }}
          WORKERS: ${{ matrix.workers }}
        run: |
          shard=()
          for name in $SHARD; do shard+=(--shard "$name"); done
          workers=()
          workers=(--workers "${WORKERS:-3}")
          python scripts/run_full_test_suite.py --tier "$TIER" "${shard[@]}" "${workers[@]}" --no-coverage \
            --budget-seconds "$BUDGET" --test-timeout-seconds 300
      - name: Free workspace
        if: always()
        run: rm -rf .venv

  gpu:
    name: GPU smoke
    needs: scope
    if: needs.scope.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, uwplasma-gpu]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install LMhdX with CUDA JAX
        run: uv venv .venv && uv pip install --python .venv/bin/python -e '.[dev]' 'jax[cuda12]'
      - name: Require the GPU backend
        run: .venv/bin/python -c "import jax; assert jax.default_backend() == 'gpu', jax.devices()"
      - name: GPU tests
        timeout-minutes: 1
        run: .venv/bin/python -m pytest -m gpu tests/test_gpu.py -q -x -p no:cacheprovider
      - name: Free workspace
        if: always()
        run: rm -rf .venv
