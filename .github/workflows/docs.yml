name: docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: lmx-docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Select documentation work
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- \
            docs src/lmhdx README.md pyproject.toml .github/workflows/docs.yml .github/actions; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: impact
    if: needs.impact.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-lmhdx
        with:
          extras: docs,dev

      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html

      - name: Check external links at integration boundaries
        if: github.event_name != 'pull_request'
        run: python -m sphinx -W -b linkcheck docs docs/_build/linkcheck
