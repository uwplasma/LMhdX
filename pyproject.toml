[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmhdx"
version = "1.9.0"
description = "JAX-native inductionless MHD toolkit for research, benchmarking, and differentiable simulation"
readme = "README.md"
authors = [{name = "Rogerio Jorge"}]
requires-python = ">=3.10,<3.14"
license = "MIT"
keywords = ["magnetohydrodynamics", "liquid-metal", "jax", "differentiable-simulation"]
dependencies = [
  "filelock",
  "jax",
  "numpy",
  "solvax>=0.19,<1",
  "tomli; python_version < '3.11'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/uwplasma/LMhdX"
Documentation = "https://lmhdx.readthedocs.io/"
Issues = "https://github.com/uwplasma/LMhdX/issues"
Source = "https://github.com/uwplasma/LMhdX"

[project.optional-dependencies]
dev = [
  "matplotlib",
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "ruff>=0.16,<1",
]
docs = [
  "sphinx",
  "myst-parser",
  "furo",
  "sphinx-copybutton",
  "sphinx-design",
]
release = [
  "build",
  "twine",
]
visualization = [
  "matplotlib",
]

[project.scripts]
lmhdx = "lmhdx.io:main"
lmx = "lmhdx.io:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lmhdx*"]

[tool.setuptools.package-data]
lmhdx = ["py.typed", "data/benchmarks/specs/*.toml", "data/benchmarks/references/*"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
timeout_method = "signal"
filterwarnings = ["error"]
markers = [
  "curated: executes the complete curated user workflows",
  "unit: isolated functionality; not a runtime classification",
  "slow: complete workflows scheduled outside pull requests",
  "gpu: requires an actual accelerator",
  "numerical: discretization, solver, conservation, and convergence checks",
  "regression: deterministic golden-profile and serialized-output checks",
  "physics: physics-level invariants for the current solver implementation",
  "validation: validation and parity harness checks",
  "external: requires an external solver, dataset, service, or accelerator",
]

[tool.coverage.run]
source = ["src/lmhdx"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
