# An insulating Hartmann duct, run with `lmhdx examples/hartmann_case.toml`.
# A table is a constructor call: [problem] with `preset = "duct"` is duct(**table), [output] is Output(**table).
schema_version = 3
name = "hartmann_ha20_toml"
units = "nondimensional"

[problem]
preset = "duct"
ha = 20.0
cells = 32

[output]
dir = "../artifacts/examples/toml_hartmann"
